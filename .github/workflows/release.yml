name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Build Binaries
        run: |
          mkdir -p dist
          
          # Build for AMD64 (x86_64)
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -tags with_gvisor,with_dhcp,with_wireguard,with_utls,with_clash_api,with_quic \
            -ldflags="-s -w" \
            -o dist/tuncli-linux-amd64 main.go
            
          # Build for ARM64 (aarch64)
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
            -tags with_gvisor,with_dhcp,with_wireguard,with_utls,with_clash_api,with_quic \
            -ldflags="-s -w" \
            -o dist/tuncli-linux-arm64 main.go

      - name: Package Assets
        run: |
          cd dist
          tar -czf tuncli-linux-amd64.tar.gz tuncli-linux-amd64
          tar -czf tuncli-linux-arm64.tar.gz tuncli-linux-arm64
          rm tuncli-linux-amd64 tuncli-linux-arm64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tuncli-linux-amd64.tar.gz
            dist/tuncli-linux-arm64.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
